name: Compose Test

on:
  push:
    branches: [main]
  pull_request:

# Pure validation job with no deployable artifact: a superseded run is waste.
concurrency:
  group: compose-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Provide compose env file
        # docker-compose.yml declares `env_file: .env` for three services and the
        # real .env is deliberately not committed, so `docker compose up -d`
        # aborted with
        #   env file .../.env not found: no such file or directory
        # on every run — the suite never reached a health check.
        # .env.example cannot simply be copied: its values are blank, and a bare
        # SECRET_KEY= makes server.settings fail pydantic validation, so every
        # service dies at import. Write the same dummy set the pytest job proves
        # sufficient, so this suite reports real service failures rather than a
        # missing-secret error it can never pass with.
        run: |
          cat > .env <<'EOF'
          SECRET_KEY=ci-not-a-secret
          BASE_URL=http://localhost:3000
          TWILIO_ACCOUNT_SID=sid
          TWILIO_AUTH_TOKEN=token
          SENDGRID_API_KEY=sg
          SENDGRID_FROM_EMAIL=from@test
          NOTIFY_EMAIL=notify@test
          DATABASE_URL=sqlite:///test.db
          EOF
      - name: Start services
        run: docker compose up -d
      - name: Wait for health checks
        run: |
          sudo apt-get update && sudo apt-get install -y jq curl
          for i in {1..30}; do
            web=$(curl -s http://localhost:3000/v1/health || true)
            echo "Web: $web"
            worker=$(docker compose exec -T celeryworker celery -A server.celery_app inspect ping -t 1 2>/dev/null || true)
            echo "Worker: $worker"
            if echo "$web" | jq -e 'all(.[]=="ok")' >/dev/null && echo "$worker" | grep -q 'pong'; then
              echo "All services healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Services failed to become healthy" >&2
          docker compose ps
          docker compose logs
          exit 1
      - name: Stop services
        if: always()
        run: docker compose down

