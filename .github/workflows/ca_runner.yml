name: CoordinatorAgent Runner

on:
  schedule:
    - cron: '0 */4 * * *'  # Run every 4 hours instead of every 10 minutes
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.CA_APP_ID }}
          private-key: ${{ secrets.CA_APP_KEY }}
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run CoordinatorAgent
        if: steps.app.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          python - <<'PY'
          from agents.coordinator import CoordinatorAgent
          import os
          from logging_config import configure_logging, logger

          configure_logging()
          agent = CoordinatorAgent(token=os.environ['GITHUB_TOKEN'])
          tasks = agent.load_tasks()
          logger.bind(count=len(tasks)).info("loaded_tasks")
          PY
      - name: Skip CoordinatorAgent (missing credentials)
        if: steps.app.outcome != 'success'
        run: echo "Skipping CoordinatorAgent - GitHub App credentials not configured"
