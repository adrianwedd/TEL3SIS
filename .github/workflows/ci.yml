name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded PR/branch run has no value: nothing downstream consumes its
# result. Cancel it so a force-push or a fast follow-up does not leave two
# full suites (pip resolve + pre-commit + pytest + a Docker build) running.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        # `ruff .` was removed from the CLI in ruff 0.5; on ruff 0.11.13 it exits
        # with "error: unrecognized subcommand '.'" before linting anything, so
        # this gate was red on every run and never examined a file.
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Check requirements lockfiles
        run: |
          # The lockfiles are generated by the pip-tools pinned in
          # requirements-dev.txt (7.4.1). That release reads
          # `PackageFinder.allow_all_prereleases`, an attribute pip removed in
          # 25.1, so on a current pip every run died with
          # `AttributeError: 'PackageFinder' object has no attribute
          # 'allow_all_prereleases'` before compiling anything. Pin pip below
          # that removal so the checker matches its own generator instead of
          # upgrading to a pip-tools whose output format differs from the
          # committed lockfiles.
          pip install "pip<25.1"
          pip-compile --quiet requirements.in
          pip-compile --quiet requirements-dev.in
          # The autogenerated header records the interpreter that produced the
          # file (3.12) while this job runs 3.11, and the `# via -r <path>`
          # annotations record the path pip-compile was handed, so a plain
          # `git diff --exit-code` fails on comment lines alone even when every
          # pin matches — which is exactly what it did on its first two real
          # executions. Compare the non-comment lines (leading whitespace
          # included: `    # via ...` is a comment too). A real version change
          # still fails; comment-only provenance differences no longer do.
          drift=$(git diff -U0 -- requirements.txt requirements-dev.txt \
            | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -vE '^[+-][[:space:]]*#' || true)
          if [ -n "$drift" ]; then
            echo "::error::requirements lockfiles are out of sync with their .in files"
            echo "$drift"
            exit 1
          fi
      - name: Install git-secrets and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y git-secrets jq
          git secrets --install -f
      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt -r requirements-dev.txt \
            --format cyclonedx-json --progress-spinner off > audit.json
          if jq -e '.vulnerabilities[] | select(.ratings[]?.severity == "HIGH" or .ratings[]?.severity == "CRITICAL")' audit.json >/dev/null; then
            echo "High severity vulnerabilities detected" >&2
            cat audit.json
            exit 1
          fi
      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Run migrations
        env:
          SECRET_KEY: x
          BASE_URL: http://localhost
          TWILIO_ACCOUNT_SID: sid
          TWILIO_AUTH_TOKEN: token
          SENDGRID_API_KEY: sg
          SENDGRID_FROM_EMAIL: from@test
          NOTIFY_EMAIL: notify@test
          DATABASE_URL: sqlite:///test.db
        run: alembic upgrade head
      - name: Run pytest
        run: pytest -vv

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: tel3sis:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
